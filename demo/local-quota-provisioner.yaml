# Source: localpv-provisioner/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ok-storage-local-quota-provisioner
  namespace: ok-storage-local-quota
  labels:
    chart: localpv-provisioner-4.6.0
    heritage: Helm
    app: localpv-provisioner
    release: ok-storage-local-quota
    component: "ok-storage-local-quota"
    openebs.io/component-name: openebs-ok-storage-local-quota
    openkubes.io/lifecycle: demo
    openkubes.io/storage-profile: local-quota
spec:
  replicas: 1
  strategy:
    type: "Recreate"
    rollingUpdate: null
  selector:
    matchLabels:
      app: localpv-provisioner
      release: ok-storage-local-quota
      component: "ok-storage-local-quota"
  template:
    metadata:
      labels:
        chart: localpv-provisioner-4.6.0
        heritage: Helm
        app: localpv-provisioner
        release: ok-storage-local-quota
        component: "ok-storage-local-quota"
        openebs.io/component-name: openebs-ok-storage-local-quota
        openkubes.io/lifecycle: demo
        openkubes.io/storage-profile: local-quota
        name: openebs-localpv-provisioner
          
        openebs.io/logging: "true"
    spec:
      serviceAccountName: ok-storage-local-quota-provisioner
      securityContext:
        {}
      containers:
      - name: ok-storage-local-quota-provisioner
        image: "docker.io/openebs/provisioner-localpv:4.6.0@sha256:99f5116f5cb83fb9d046ef5ff5b8ea98da90e7da5250d7b101bd650662238a0a"
        imagePullPolicy: IfNotPresent
        resources:
          null
        env:
        # OPENEBS_IO_K8S_MASTER enables openebs provisioner to connect to K8s
        # based on this address. This is ignored if empty.
        # This is supported for openebs provisioner version 0.5.2 onwards
        #- name: OPENEBS_IO_K8S_MASTER
        #  value: "http://10.128.0.12:8080"
        # OPENEBS_IO_KUBE_CONFIG enables openebs provisioner to connect to K8s
        # based on this config. This is ignored if empty.
        # This is supported for openebs provisioner version 0.5.2 onwards
        #- name: OPENEBS_IO_KUBE_CONFIG
        #  value: "/home/ubuntu/.kube/config"
        - name: OPENEBS_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # OPENEBS_SERVICE_ACCOUNT provides the service account of this pod as
        # environment variable
        - name: OPENEBS_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        # OPENEBS_IO_BASE_PATH is the environment variable that provides the
        # default base path on the node where host-path PVs will be provisioned.
        - name: OPENEBS_IO_ENABLE_ANALYTICS
          value: "false"
          # OPENEBS_IO_ANALYTICS_STATE_CM names the ConfigMap consulted to
          # decide whether to emit the install event for this Helm release
          # and to persist ping/heartbeat timestamps across pod restarts.
          # The provisioner creates and updates this ConfigMap itself; it
          # is not managed by Helm. helm uninstall does not remove it, so
          # reinstalls into the same namespace will not re-fire the install
          # event unless the ConfigMap is deleted manually.
        - name: OPENEBS_IO_ANALYTICS_STATE_CM
          value: "ok-storage-local-quota-provisioner-analytics-state"
        - name: OPENEBS_IO_BASE_PATH
          value: "/var/openebs/local-quota"
        - name: OPENEBS_IO_WORKER_THREADS
          value: "4"
        - name: OPENEBS_IO_IMAGE_PULL_POLICY
          value: "IfNotPresent"
        - name: OPENEBS_IO_HELPER_IMAGE
          value: "docker.io/openebs/linux-utils:4.6.0@sha256:a3043d266b1c06fb42377ced0c3fc190c66e1e83ae1efda7670ed73feb4ede14"
        - name: OPENEBS_IO_HELPER_POD_HOST_NETWORK
          value: "false"
        - name: OPENEBS_IO_INSTALLER_TYPE
          value: "localpv-charts-helm-helperpod"
        - name: OPENEBS_IO_HELPER_POD_TIMEOUT_SECS
          value: "120"
        # LEADER_ELECTION_ENABLED is used to enable/disable leader election. By default
        # leader election is enabled.
        - name: LEADER_ELECTION_ENABLED
          value: "true"
        # OPENEBS_IO_HEALTH_PROBE_BIND_ADDRESS is the address the health-probe
        # HTTP server binds to. /healthz serves liveness, /readyz serves readiness.
        - name: OPENEBS_IO_HEALTH_PROBE_BIND_ADDRESS
          value: ":8081"        
        
        
        ports:
        - name: healthz
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 1
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 1
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      tolerations: 
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 5
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 5
